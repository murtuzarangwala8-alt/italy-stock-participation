<html>
<head>
    <title>Interactive Presentation</title>
    <style>
        body { font-family: Arial, sans-serif; }
        h1 { color: #333; }
        #presentation { border: 1px solid #ccc; padding: 20px; }
    </style>
</head>
<body>
    <div id="presentation">
        <h1>Welcome to the Interactive Presentation</h1>
        <p>Click the button below to start!</p>
        <button onclick="startPresentation()">Start Presentation</button>
    </div>
    <script>
        function startPresentation() {
            alert('Presentation Started!');
        }
    </script>
</body>
</html>
